name: Verify DoubleCross

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required game files
        run: |
          test -f index.html
          test -f styles.css
          test -f src/game.js
          test -f manifest.webmanifest
          test -f sw.js
      - name: Check game JavaScript
        run: node --check src/game.js
      - name: Package playable web build
        uses: actions/upload-artifact@v4
        with:
          name: doublecross-playable-web
          path: |
            index.html
            styles.css
            src/game.js
            manifest.webmanifest
            sw.js
          if-no-files-found: error
