plugins {
    id 'com.android.application'
}

def stableDebugKeystore = file('debug.keystore')
def stableDebugKeystoreB64 = file('debug.keystore.b64')
if (!stableDebugKeystore.exists() && stableDebugKeystoreB64.exists()) {
    stableDebugKeystore.bytes = stableDebugKeystoreB64.text.trim().decodeBase64()
}

android {
    namespace 'com.simplebusiness.doublecross'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simplebusiness.doublecross'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }

    signingConfigs {
        debug {
            storeFile stableDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir('generated/doublecrossAssets'))
        }
    }
}

def generatedAssets = layout.buildDirectory.dir('generated/doublecrossAssets')

tasks.register('syncGameAssets', Sync) {
    from(rootProject.projectDir) {
        include 'index.html'
        include 'styles.css'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'src/game.js'
    }
    into(generatedAssets)
}

tasks.named('preBuild').configure {
    dependsOn('syncGameAssets')
}
